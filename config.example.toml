# cp config.example.toml config.toml 후 수정하세요.

# paper: 실제 시세 + 가상 돈 (기본, 권장)
# live : 실제 주문. AUTOTRADER_LIVE_CONFIRM=yes-i-accept-the-risk 환경변수도 있어야 실행됨
mode = "paper"
state_dir = "state"

[strategy]
# 어제까지 N일 종가 평균보다 오늘 가격이 높으면 보유, 낮아지면 매도
ma_days = 20
# 매수 후보. 1주 가격이 계좌 예산보다 비싸면 자동으로 건너뜁니다.
# 아래는 형식 예시일 뿐 추천이 아닙니다 — 5,000원 이하로 1주를 살 수 있는 종목을 직접 골라 넣으세요.
universe = [
  { code = "069500", name = "KODEX 200", kind = "etf" },
]

[risk]
max_order_krw = 5000        # 1회 매수 최대 금액
max_orders_per_day = 1      # 계좌별 하루 주문 횟수 (수수료 방어)
stop_loss_pct = 0.07        # 평단 대비 -7% 면 매도
trading_start = "09:10"     # 장 시작 직후 변동성 회피
trading_end = "15:10"       # 동시호가(15:20~) 전

[costs]
# 증권사 이벤트·등급에 따라 다름. 본인 계좌 조건으로 확인 후 수정하세요.
fee_rate = 0.00015
stock_sell_tax_rate = 0.0020  # 국내주식 매도 시 증권거래세(+농특세). 시행 세율 확인 필요
etf_sell_tax_rate = 0.0       # 국내 ETF 는 매도 거래세 없음

[jev]
enabled = true
model = "jev-latest"
veto_threshold = 0.6          # 악재 확률이 이 이상이면 매수 보류
max_calls_per_day = 3         # Jev 비용 상한
headlines_dir = "news"        # news/<종목코드>.txt 에 한 줄에 하나씩 헤드라인
max_headlines = 15
# 비워두면 RSS 수집 안 함. {name} {code} 치환됨
rss_url_template = "https://news.google.com/rss/search?q={name}&hl=ko&gl=KR&ceid=KR:ko"

# 두 계좌 합계 10,000원
[accounts.kiwoom]
broker = "kiwoom"
enabled = true
budget_krw = 5000
server = "mock"               # mock: 키움 모의투자 서버, real: 실계좌

[accounts.toss]
broker = "toss"
enabled = true
budget_krw = 5000             # 토스 실주문은 아직 미구현 → paper 모드에서만 동작
